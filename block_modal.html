<div class="modal-panel image-viewer-modal" role="dialog" aria-modal="true" aria-labelledby="imageViewerBlockModalTitle" data-image-viewer-modal-root data-block-runtime-refresh="autonomous">
  <div class="modal-header">
    <div>
      <span class="panel-kicker">Image Viewer</span>
      <h2 id="imageViewerBlockModalTitle">{{ title }}</h2>
    </div>
    <div class="modal-actions image-viewer-toolbar">
      <button class="ghost-btn" data-image-viewer-zoom-out type="button" {{ controls_disabled }} title="Zoom arriere">-</button>
      <button class="ghost-btn" data-image-viewer-zoom-in type="button" {{ controls_disabled }} title="Zoom avant">+</button>
      <button class="ghost-btn" data-image-viewer-fit type="button" {{ controls_disabled }}>Fit</button>
      <button class="ghost-btn" data-image-viewer-actual type="button" {{ controls_disabled }}>100%</button>
      <button class="primary-btn" data-block-apply type="button">Apply</button>
      <button class="ghost-btn" data-close-block-modal type="button">Close</button>
    </div>
  </div>
  <div class="image-viewer-modal-body">
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label">Identite</span></div>
      <div class="field-group">
        <label>Block name</label>
        <input data-block-title-field type="text" autocomplete="off" value="{{ title }}" />
      </div>
    </section>
    <section class="image-viewer-stage-section">
      <div class="image-viewer-stage" data-image-viewer-stage>
        <img class="image-viewer-full {{ image_hidden }}" src="{{ image_src }}" alt="" draggable="false" data-image-viewer-image />
        <div class="image-viewer-empty {{ state_hidden }}" data-image-viewer-state>{{ state_text }}</div>
      </div>
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label">Etat</span></div>
      <div class="image-viewer-status-grid">
        <span>Type</span><strong>{{ source_kind }}</strong>
        <span>MIME</span><strong>{{ mime_type }}</strong>
        <span>Taille</span><strong>{{ byte_size }}</strong>
      </div>
    </section>
  </div>
</div>
