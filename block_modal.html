<div data-properties-surface="modal" class="modal-panel image-viewer-modal" role="dialog" aria-modal="true" aria-labelledby="imageViewerBlockModalTitle" data-image-viewer-modal-root data-block-runtime-refresh="autonomous">
  <div class="modal-header">
    <div>
      <span class="panel-kicker" data-i18n="block.image_viewer.modal_kicker">Image Viewer</span>
      <h2 id="imageViewerBlockModalTitle">{{ title }}</h2>
    </div>
    <div class="modal-actions image-viewer-toolbar">
      <button class="ghost-btn" data-image-viewer-zoom-out type="button" {{ controls_disabled }} title="Zoom out" data-i18n-title="block.image_viewer.zoom_out">-</button>
      <button class="ghost-btn" data-image-viewer-zoom-in type="button" {{ controls_disabled }} title="Zoom in" data-i18n-title="block.image_viewer.zoom_in">+</button>
      <button class="ghost-btn" data-image-viewer-fit type="button" {{ controls_disabled }} data-i18n="block.image_viewer.fit">Fit</button>
      <button class="ghost-btn" data-image-viewer-actual type="button" {{ controls_disabled }}>100%</button>
      <button class="primary-btn" data-block-apply type="button" data-i18n="ui.block_kit.apply">Apply</button>
      <button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.close">Close</button>
    </div>
  </div>
  <div class="image-viewer-modal-body">
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="ui.block_kit.identity">Identity</span></div>
      <div class="field-group">
        <label data-i18n="ui.block_kit.block_name">Block name</label>
        <input data-block-title-field type="text" autocomplete="off" value="{{ title }}" />
      </div>
    </section>
    <section class="image-viewer-stage-section">
      <div class="image-viewer-stage" data-image-viewer-stage>
        <img class="image-viewer-full {{ image_hidden }}" src="{{ image_src }}" alt="" draggable="false" data-image-viewer-image />
        <div class="image-viewer-empty {{ state_hidden }}" data-image-viewer-state>{{ state_text }}</div>
      </div>
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="block.image_viewer.state_section">State</span></div>
      <div class="image-viewer-status-grid">
        <span data-i18n="block.image_viewer.type_label">Type</span><strong>{{ source_kind }}</strong>
        <span data-i18n="block.image_viewer.mime_label">MIME</span><strong>{{ mime_type }}</strong>
        <span data-i18n="block.image_viewer.size_label">Size</span><strong>{{ byte_size }}</strong>
      </div>
    </section>
  </div>
</div>
